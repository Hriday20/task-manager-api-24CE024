services:
  backend:
    build: .
    ports:
      - "5003:5003"
    environment:
      PORT: "5003"
      MONGO_URI: mongodb://mongodb:27017/taskmanager
      JWT_SECRET: practical11-local-development-secret
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../student-portfolio
      args:
        VITE_API_URL: http://localhost:5003
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data: